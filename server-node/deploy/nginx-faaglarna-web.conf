# nginx server block for the Faaglarna FRONTEND, served from this VPS.
#
# This replaces GitHub Pages. Frontend and API share one origin:
#
#   /          -> static files from /srv/faaglarna-web/static
#   /api/      -> Node on 127.0.0.1:3001
#   /collab/   -> Hocuspocus on 127.0.0.1:3003 (WebSocket)
#
# WHY SAME ORIGIN. With the page and the API on one hostname there is no
# cross-origin request at all: no preflights, no ALLOWED_ORIGINS to keep in step
# with the frontend's address, and no way to get CORS subtly wrong. The API's
# CORS middleware stays in place and simply never has to do anything.
#
# backend.js still resolves correctly: its probe of /api/tree gets 401 (not ok),
# so it falls through to the cloud branch, which then talks to its own origin.
#
# Install:
#   sudo cp deploy/nginx-faaglarna-web.conf \
#           /etc/nginx/sites-available/faaglarna.lektorensrud.no
#   sudo ln -s /etc/nginx/sites-available/faaglarna.lektorensrud.no \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d faaglarna.lektorensrud.no
#
# DNS must already point faaglarna.lektorensrud.no at THIS box (an A record),
# not at GitHub Pages.

server {
    listen 80;
    listen [::]:80;
    server_name faaglarna.lektorensrud.no;

    root /srv/faaglarna-web/static;
    index index.html;

    # .fdx imports are XML and can be a few MB on a feature-length script.
    client_max_body_size 8m;

    # The Yjs bundle is ~120 kB and the app's own JS is not small either.
    gzip on;
    # text/javascript is what nginx actually labels a .js file as; without it
    # every script here, the 122 kB Yjs bundle included, went uncompressed.
    gzip_types text/plain text/css application/javascript text/javascript
               application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # ---- collaboration WebSocket ----------------------------------------
    # Needs the Upgrade/Connection headers to survive the proxy hop, and a long
    # read timeout: nginx's default 60s would drop an idle editing session.
    # EXACT match (`location = /collab`), for two reasons:
    #
    #   - The Hocuspocus provider treats `url` as the socket endpoint and sends
    #     the document name in the PROTOCOL, not the path - and it strips
    #     trailing slashes - so the browser connects to exactly /collab.
    #     `location /collab/` would not match, and the socket never opens.
    #   - A prefix `location /collab` would also swallow /collab.js, proxying
    #     the frontend's own script to the WebSocket server. The browser then
    #     gets a non-JS body and window.Collab never exists.
    location = /collab {
        proxy_pass http://127.0.0.1:3003/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ---- API -------------------------------------------------------------
    # No trailing slash on proxy_pass, so the full /api/... path is preserved.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- static frontend --------------------------------------------------
    # index.html and config.js must never be cached hard, or a deploy leaves
    # people on the old app pointing at the old settings.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /config.js  { add_header Cache-Control "no-cache"; }

    # The service worker decides what every other file may be. Browsers already
    # revalidate it, but a cached one would pin the app to an old shell for as
    # long as it lived, so it is explicit here.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # NAMED .json, NOT .webmanifest, on purpose. nginx's default mime.types has
    # no entry for .webmanifest and serves it as application/octet-stream, which
    # is not a JSON MIME type, so the browser discards the manifest and the app
    # silently stops being installable - confirmed by curl against the live
    # server, not assumed. .json is in the stock table as application/json,
    # which the spec accepts, so installability does not depend on this block
    # having been applied. The block only upgrades it to the exact type and
    # keeps it out of caches.
    location = /manifest.json {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # The vendored Yjs bundle is regenerated only when its pinned versions
    # change, so it is safe to cache for a while.
    location /vendor/ { add_header Cache-Control "public, max-age=86400"; }

    location / {
        try_files $uri $uri/ =404;
    }
}
