# nginx server block for the Faaglarna API.
#
#   sudo cp deploy/nginx-faaglarna.conf /etc/nginx/sites-available/api-faaglarna.lektorensrud.no
#   sudo ln -s /etc/nginx/sites-available/api-faaglarna.lektorensrud.no /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api-faaglarna.lektorensrud.no      # DNS must resolve here FIRST
#
# certbot rewrites this file in place: it adds the `listen 443 ssl` block and
# turns the port-80 block into a redirect. Start HTTP-only, as below.
#
# Two upstreams, one process: the REST API on 3001 and the collaboration
# WebSocket on 3003.

server {
    listen 80;
    listen [::]:80;
    server_name api-faaglarna.lektorensrud.no;

    # .fdx imports are XML and can be a few MB on a feature-length script.
    client_max_body_size 8m;

    # ---- collaboration WebSocket ----------------------------------------
    # NOTE: this differs from the generic template in README-add-service.md,
    # which is HTTP-only. A WebSocket needs the Upgrade/Connection headers to
    # survive the proxy hop, and nginx's default proxy_read_timeout of 60s
    # would drop an idle editing session — hence the long timeouts.
    #
    # The trailing slash on proxy_pass strips the /collab/ prefix, so the
    # document name Hocuspocus sees is just the document UUID.
    location = /collab {
        proxy_pass http://127.0.0.1:3003/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ---- REST API --------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
