# Publishes the Screenplay Reader frontend (the `static/` folder) to GitHub
# Pages on every push to main. The site is fully client-side: scripts are stored
# in the visitor's browser (IndexedDB) by static/backend.js, so no server runs
# behind it.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". After that, every push deploys automatically and the app
# lives at https://<your-user>.github.io/<repo>/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: static
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
